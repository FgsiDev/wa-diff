name: Daily WhatsApp Diff Update

"on":
  push:
    branches:
      - master
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-wa-diff
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run daily fetch and export
        run: npm run fetch

      - name: Commit and push changes
        id: commit
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${BRANCH_NAME}"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          timestamp="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git commit -m "chore: daily whatsapp bundles update (${timestamp})"

          for attempt in 1 2 3; do
            git fetch origin "${branch}"
            git rebase "origin/${branch}"

            if git push origin "HEAD:${branch}"; then
              echo "Push succeeded on attempt ${attempt}."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push was rejected, retrying..."
          done

          echo "Failed to push after 3 attempts."
          exit 1

      - name: Prepare release metadata
        id: summary
        if: steps.commit.outputs.pushed == 'true'
        run: |
          set -euo pipefail

          tag="v$(date -u +'%Y.%m.%d-%H%M%S')"
          title="WhatsApp bundles update - $(date -u +'%d %B %Y, %H:%M UTC')"

          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          prev_sha="$(git rev-parse HEAD~1)"

          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          {
            echo "body<<EOF"
            echo "Automated daily update of WhatsApp Web bundle exports."
            echo ""
            echo "**Commit:** [\`${short_sha}\`](${repo_url}/commit/${sha})"
            echo "**View changes:** [\`${prev_sha:0:7}...${short_sha}\`](${repo_url}/compare/${prev_sha}...${sha})"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          
      - name: Zip files folder
        id: zip
        if: steps.commit.outputs.pushed == 'true'
        run: |
          set -euo pipefail
          zip_name="wa-files.zip"
          cd files
          zip -r -q "../${zip_name}" .
          cd ..
          echo "zip_path=${zip_name}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.summary.outputs.tag }}
          TITLE: ${{ steps.summary.outputs.title }}
          BODY: ${{ steps.summary.outputs.body }}
          ZIP_PATH: ${{ steps.zip.outputs.zip_path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ZIP_PATH" --title "$TITLE" --notes "$BODY" --target "$GITHUB_SHA"